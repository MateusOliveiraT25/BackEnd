<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lançamento de Notas</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css">
</head>
<body>
    <div class="container">
        <h1>Lançamento de Notas</h1>
        <form>
            <div class="mb-3">
                <label for="inputAluno" class="form-label">Aluno</label>
                <input type="text" class="form-control" id="inputAluno" placeholder="Nome do aluno" required>
            </div>
            <div class="mb-3">
                <label for="inputNota" class="form-label">Nota</label>
                <input type="number" class="form-control" id="inputNota" placeholder="Nota do aluno" required>
            </div>
            <div class="mb-3">
                <label for="inputDisciplina" class="form-label">Disciplina</label>
                <input type="text" class="form-control" id="inputDisciplina" placeholder="Nome da disciplina" required>
            </div>
            <button type="submit" class="btn btn-primary">Lançar Nota</button>
        </form>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
