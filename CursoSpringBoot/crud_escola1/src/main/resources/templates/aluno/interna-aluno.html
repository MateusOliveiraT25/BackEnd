<!DOCTYPE html>
<html lang="pt-br" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Verificação de Professor e Disciplina</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
        <link rel="stylesheet" th:href="@{/styleInterno.css}">
    <link rel="stylesheet" th:href="@{style.css}">
</head>
<body>
    <div class="container">
        <h1>Verificação de Professor e Disciplina</h1>
        <p>Professor: <strong>Nome do Professor</strong></p>
        <p>Disciplina: <strong>Nome da Disciplina</strong></p>
        <hr>
        <h2>Notas dos Alunos</h2>
        <table class="table">
            <thead>
                <tr>
                    <th scope="col">Aluno</th>
                    <th scope="col">Nota</th>
                </tr>
            </thead>
            <tbody>
                <tr>
                    <td>Nome do Aluno 1</td>
                    <td>Nota 1</td>
                </tr>
                <tr>
                    <td>Nome do Aluno 2</td>
                    <td>Nota 2</td>
                </tr>
                <!-- Adicione mais linhas conforme necessário -->
            </tbody>
        </table>
    </div>
  
</body>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js"></script>
</html>
